<!-- Portfolio illustration summarizing customer segmentation and matched-store evaluation. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Quantium retail analytics</title>
  <desc id="desc">Retail trial and control store bars alongside customer-segment cards on a green analytics canvas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#123c38"/>
      <stop offset="1" stop-color="#246653"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#bg)"/>
  <text x="42" y="55" fill="#f7fff7" font-family="Arial, sans-serif" font-size="24" font-weight="700">QUANTIUM RETAIL ANALYTICS</text>
  <text x="42" y="80" fill="#bce4cf" font-family="Arial, sans-serif" font-size="13">customer segments · trial stores · matched controls</text>
  <g transform="translate(42 110)">
    <rect width="208" height="190" rx="8" fill="#effaf2"/>
    <text x="22" y="30" fill="#234c40" font-family="Arial, sans-serif" font-size="13" font-weight="700">TOP SEGMENTS</text>
    <rect x="22" y="48" width="164" height="46" rx="6" fill="#d5ebcc"/>
    <circle cx="45" cy="71" r="12" fill="#70a95e"/>
    <text x="66" y="68" fill="#234c40" font-family="Arial, sans-serif" font-size="11" font-weight="700">Budget Older Families</text>
    <text x="66" y="84" fill="#537365" font-family="Arial, sans-serif" font-size="10">highest total sales</text>
    <rect x="22" y="106" width="164" height="58" rx="6" fill="#d8edf0"/>
    <circle cx="45" cy="135" r="12" fill="#55a2a9"/>
    <text x="66" y="127" fill="#234c40" font-family="Arial, sans-serif" font-size="11" font-weight="700">Mainstream Young</text>
    <text x="66" y="141" fill="#234c40" font-family="Arial, sans-serif" font-size="11" font-weight="700">Singles / Couples</text>
    <text x="66" y="155" fill="#537365" font-family="Arial, sans-serif" font-size="10">largest customer base</text>
  </g>
  <g transform="translate(272 110)">
    <rect width="326" height="190" rx="8" fill="#fff"/>
    <text x="20" y="30" fill="#234c40" font-family="Arial, sans-serif" font-size="13" font-weight="700">TRIAL VS CONTROL · SALES</text>
    <path d="M38 46v112h260" stroke="#9ab8a8" stroke-width="2"/>
    <g>
      <rect x="68" y="78" width="28" height="80" rx="3" fill="#e1b34a"/>
      <rect x="101" y="103" width="28" height="55" rx="3" fill="#9db2a5"/>
      <rect x="158" y="104" width="28" height="54" rx="3" fill="#e1b34a"/>
      <rect x="191" y="112" width="28" height="46" rx="3" fill="#9db2a5"/>
      <rect x="248" y="93" width="28" height="65" rx="3" fill="#e1b34a"/>
      <rect x="281" y="102" width="28" height="56" rx="3" fill="#9db2a5"/>
    </g>
    <g fill="#4d6a5d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">
      <text x="98" y="176">77 / 233</text><text x="188" y="176">86 / 155</text><text x="278" y="176">88 / 237</text>
    </g>
    <circle cx="190" cy="27" r="5" fill="#e1b34a"/><text x="200" y="31" fill="#4d6a5d" font-family="Arial, sans-serif" font-size="10">TRIAL</text>
    <circle cx="244" cy="27" r="5" fill="#9db2a5"/><text x="254" y="31" fill="#4d6a5d" font-family="Arial, sans-serif" font-size="10">CONTROL</text>
  </g>
  <text x="42" y="329" fill="#d8f3e0" font-family="Arial, sans-serif" font-size="14">Documented Forage case study · Python + Jupyter</text>
</svg>
