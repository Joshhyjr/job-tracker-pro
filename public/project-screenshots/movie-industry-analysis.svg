<!-- Portfolio illustration reflecting the notebook's budget-to-gross correlation analysis. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Movie industry analysis</title>
  <desc id="desc">A cinema-inspired scatter plot showing an upward relationship between movie budget and worldwide gross revenue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#21162f"/>
      <stop offset="1" stop-color="#4c2148"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#bg)"/>
  <text x="42" y="55" fill="#fff7ec" font-family="Arial, sans-serif" font-size="24" font-weight="700">MOVIE INDUSTRY ANALYSIS</text>
  <text x="42" y="80" fill="#e7bfd2" font-family="Arial, sans-serif" font-size="13">7,668 films · Python · Pearson correlation</text>
  <g transform="translate(46 110)">
    <rect width="548" height="190" rx="8" fill="#fffaf5"/>
    <path d="M48 26v126h462" stroke="#56304f" stroke-width="3"/>
    <path d="M60 142L492 36" stroke="#df5f76" stroke-width="5" stroke-linecap="round" opacity=".85"/>
    <g fill="#71436d" opacity=".78">
      <circle cx="72" cy="136" r="7"/><circle cx="94" cy="123" r="5"/><circle cx="118" cy="132" r="6"/>
      <circle cx="145" cy="110" r="8"/><circle cx="171" cy="119" r="5"/><circle cx="201" cy="92" r="7"/>
      <circle cx="230" cy="104" r="6"/><circle cx="254" cy="79" r="8"/><circle cx="286" cy="88" r="5"/>
      <circle cx="316" cy="67" r="7"/><circle cx="347" cy="77" r="6"/><circle cx="374" cy="51" r="8"/>
      <circle cx="407" cy="61" r="5"/><circle cx="444" cy="38" r="7"/><circle cx="482" cy="45" r="6"/>
    </g>
    <text x="278" y="178" text-anchor="middle" fill="#56304f" font-family="Arial, sans-serif" font-size="12">PRODUCTION BUDGET →</text>
    <text transform="translate(18 92) rotate(-90)" text-anchor="middle" fill="#56304f" font-family="Arial, sans-serif" font-size="12">WORLDWIDE GROSS →</text>
    <rect x="402" y="112" width="100" height="30" rx="15" fill="#f4d7c6"/>
    <text x="452" y="132" text-anchor="middle" fill="#662f47" font-family="Arial, sans-serif" font-size="13" font-weight="700">r ≈ 0.75</text>
  </g>
  <text x="46" y="329" fill="#f2d5df" font-family="Arial, sans-serif" font-size="14">pandas + seaborn + Jupyter</text>
</svg>
